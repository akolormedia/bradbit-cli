name: CI

on:
  push:
    branches: [dev, "feat/**"]
  pull_request:

jobs:
  build:
    name: Build macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install

      - name: Build darwin-arm64
        run: bun run --cwd packages/cli script/build.ts --skip-web-ui --outdir=dist/arm64
        env:
          OPENCODE_TARGET: darwin-arm64

      - name: Build darwin-x64
        run: bun run --cwd packages/cli script/build.ts --skip-web-ui --outdir=dist/x64
        env:
          OPENCODE_TARGET: darwin-x64

      - name: Contract test (arm64)
        run: BRADBIT_BIN="$PWD/packages/cli/dist/arm64/cli-darwin-arm64/bin/bradbit" bun run packages/cli/test/contract/serve-contract.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bradbit-macos
          path: |
            packages/cli/dist/arm64/cli-darwin-arm64/bin/bradbit
            packages/cli/dist/x64/cli-darwin-x64/bin/bradbit
